services:
  web-ui:
    build: ./web-ui
    ports:
      - "3000:80"
    depends_on:
      - media-scraper-service
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  media-scraper-service:
    build: ./media-scraper-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DB_HOST=postgres
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=5432
      - DB_LOGGING=${DB_LOGGING:-schema,error,warn,migration}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-20}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SCRAPER_CONCURRENCY=${SCRAPER_CONCURRENCY:-20}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${DB_PORT}:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"

  bull-monitor:
    image: ejhayes/nodejs-bull-monitor:2.2.0
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT}
      - BULL_COLLECT_QUEUE_METRICS_INTERVAL_MS=5000
      # - UI=bull-master
      - UI=bull-board
      - BULL_WATCH_QUEUE_PREFIXES=bull
    ports:
      - "3002:3000"
    depends_on:
      - redis

volumes:
  postgres_data: